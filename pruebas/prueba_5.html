<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>AR GPS Sin Marcador</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js (incluye GPS) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
        gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"

      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Cámara con GPS -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- Modelo en coordenadas reales -->
      <a-entity
        gltf-model="5.glb"
        gps-entity-place="latitude: 18.51408854; longitude: -88.29677548;"
        scale="20 20 20"
position="0 10 0"
        rotation="0 180 0">
      </a-entity>

<a-entity
        gltf-model="1.glb"
        gps-entity-place="latitude: 18.51418854; longitude: -88.29687548;"
        scale="20 20 20"
position="0 10 0"
        rotation="0 180 0">
      </a-entity>









    </a-scene>
  </body>
</html>
