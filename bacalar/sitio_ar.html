<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Estación Bacalar</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>
    <!-- AR.js (incluye GPS) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden">
    <a-scene gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/" embedded
        vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Cámara con GPS -->
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Modelo en coordenadas reales -->

        <a-entity gltf-model="castillo.glb" gps-entity-place="latitude: 18.51007819; longitude: -88.3098308" scale="60 60 60"
            position="-137.33376 334.529 -347.51283" rotation="0 180 0">
        </a-entity>

        <a-entity gltf-model="1.glb" gps-entity-place="latitude: 18.51408850; longitude: -88.29677542;" scale="20 20 20"
            position="0 2 0" rotation="0 180 0">
        </a-entity>
    </a-scene>
</body>

</html>
