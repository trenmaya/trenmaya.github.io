<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materiales</title>
    <link rel="stylesheet" href="../../styles.css" />

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/tizzle/aframe-orbit-controls-component/master/dist/aframe-orbit-controls-component.min.js"></script>
  </head>

  <body class="chak">
    <div class="main-container">
      <div class="header-title">
        <img src="imagenes\logo.png" alt="Logotipo" class="logo" />
        <h1>Chak Báalam</h1>
      </div>
      <div class="top-buttons">
        <a href="mapa.html" class="styled-button">Mapas</a>
        <a href="juego.html" class="styled-button">Juegos</a>
        <a href="sitio_ar.html" class="styled-button">Sitio AR </a>
      </div>
      <div class="gallery-container">
        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/1.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/1.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Vaso tipo Infierno Negro', 'modelos/2.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/2.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/3.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/3.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Plato tipo Aguila Anaranjado', 'modelos/4.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/4.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/5.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/5.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/6.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/6.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/7.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/7.jpg" alt="Plato" />
        </div>

        <div
          class="gallery-item"
          onclick="loadModel('Cajete tipo Águila Anaranjado', 'modelos/8.glb', 'Se encuentra pulido y presenta engobe monócromo')"
        >
          <img src="imagenes/8.jpg" alt="Plato" />
        </div>
      </div>
      <!-- Modal único con una sola escena -->
      <div id="viewer" class="modal">
        <div class="modal-content">
          <span class="close" onclick="closeViewer()">&times;</span>
          <h2 id="viewer-title"></h2>
          <div id="aframe-container">
            <a-scene
              gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
              embedded
            >
              <a-assets id="dynamic-assets"></a-assets>
              <a-entity
                id="camera"
                camera
                look-controls
                orbit-controls="target: #target;
                  autoRotate: false;
                  enableDamping: true;
                  dampingFactor: 0.125;
                  rotateSpeed: 0.08;
                  minDistance: 0.2;
                  maxDistance: 0.2;"
                position="0.2 0.2 0.2"
              ></a-entity>
              <a-entity id="target" position="0 0 0"></a-entity>
              <a-entity light="type: ambient; intensity: 1.5"></a-entity>
              <a-sky color="#E6F3F5"></a-sky>
            </a-scene>
          </div>
          <p id="viewer-desc"></p>
        </div>
      </div>
    </div>

    <script>
      function loadModel(title, modelPath, description) {
        document.getElementById("viewer-title").textContent = title;
        document.getElementById("viewer-desc").textContent = description;

        const target = document.getElementById("target");
        if (target.hasAttribute("gltf-model")) {
          target.removeAttribute("gltf-model");
        }
        target.setAttribute("gltf-model", modelPath);
        document.getElementById("viewer").classList.add("show");
      }

      function closeViewer() {
        document.getElementById("viewer").classList.remove("show");
        document.getElementById("target").removeAttribute("gltf-model");
      }
    </script>
  </body>
</html>
