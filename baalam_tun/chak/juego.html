 <link rel="stylesheet" href="../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">

<body class="chak">
    <div class="main-container">
        <div class="header-title">
            <img src="imagenes\logo.png" alt="Logotipo" class="logo">
            <h1>Chak Báalam</h1>
        </div>

        <div class="top-buttons">
            <a href="introduccion.html" class="styled-button">Introducción</a>
            <a href="materiales_1.html" class="styled-button">Mapas</a>
            <a href="sitio_1.html" class="styled-button">Juegos</a>
            <a href="sitio_2.html" class="styled-button">Sitio </a>
        </div>





        <div class="game-wrapper">
            <h1>Ahorcado. Chak Báalam</h1>
            <p id="word-display"></p>
            <p id="message"></p>
            <div id="letters"></div>
            <p>Intentos: <span id="attempts">6</span></p>

            <!-- Modal for Word Info -->
            <div id="word-info-modal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2 id="word-title"></h2>
                    <p id="word-meaning"></p>
                    <button onclick="restartGame()">Jugar de nuevo</button>
                </div>
            </div>
        </div>
        <script src="juego.js"></script>
</body>
